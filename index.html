<!DOCTYPE HTML>
<html>
	<head>

		<title>LSE Futures Desk</title>

		<!-- Fix for iOS Safari zooming bug -->
		<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0">
		<meta name="theme-color" content="#070809">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="dashboard.css?v=20261027-17">

		<script type="text/javascript" src="charting_library/charting_library.standalone.js"></script>
		<script type="text/javascript" src="datafeeds/lse-live-datafeed.js?v=20261027-3"></script>
		<script type="text/javascript" src="datafeeds/hourly-range-bands.js?v=20261024-4"></script>

		<script type="text/javascript">

			function getParameterByName(name) {
				name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
				var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
					results = regex.exec(location.search);
				return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
			}

			function initOnReady() {
				var datafeedUrl = window.location.origin;
				var themePresets = [
					{ id: 'obsidian', title: 'Obsidian', detail: 'Pure black with muted sage accents' },
					{ id: 'midnight', title: 'Midnight', detail: 'Deep navy with cool blue accents' },
					{ id: 'graphite', title: 'Graphite', detail: 'Neutral charcoal with silver accents' },
					{ id: 'forest', title: 'Forest', detail: 'Black pine with restrained green accents' },
					{ id: 'plum', title: 'Plum', detail: 'Near-black violet with soft lilac accents' },
				];
				var savedTheme = localStorage.getItem('lse-theme');
				var initialTheme = themePresets.some(function (theme) { return theme.id === savedTheme; }) ?
					savedTheme : 'obsidian';
				var chartLayoutStorageKey = 'lse-chart-layout-v1';
				var chartGridStorageKey = 'lse-chart-desktop-v1';
				var canvasStorageKey = 'lse-canvas-workspaces-v1';
				localStorage.removeItem('lse-paper-account-v1');
				localStorage.removeItem('lse-paper-execution-marks');
				localStorage.removeItem('mfp-selected-account');
				var chartGrid = document.getElementById('chart-grid');
				var chartFrame = document.querySelector('.chart-frame');
				var canvasTabs = document.getElementById('canvas-tabs');
				var addCanvasButton = document.getElementById('add-canvas');
				var addChartButton = document.getElementById('add-chart-window');
				var commandPalette = document.getElementById('command-palette');
				var commandInput = document.getElementById('command-palette-input');
				var commandResults = document.getElementById('command-palette-results');
				var activeChartSelect = document.getElementById('active-chart-select');
				var watchlistToggleStorageKey = 'lse-watchlist-hidden-v1';
				var watchlistPositionStorageKey = 'lse-watchlist-window-position-v1';
				var watchlistPanel = document.querySelector('.watchlist-panel');
				var chartWidgets = [];
				var calendarAppWindow = null;
				var readyChartIndexes = new Set();
				var pendingSymbols = new Map();
				var drawingSyncStorageKey = 'lse-chart-drawing-sync-v1';
				var drawingSyncEnabled = localStorage.getItem(drawingSyncStorageKey) !== 'false';
				var drawingMirrorRegistry = new Map();
				var mirroredDrawingIds = new Set();
				var drawingSyncTimers = new Map();
				var activeWidgetIndex = 0;
				var maxChartWindows = 8;
				var workspaceCanvases = [];
				var activeCanvasId = 'canvas-1';
				var nextCanvasId = 2;
				var visibleChartIndexes = [0];
				var chartWindowRects = {};
				var minimizedChartIndexes = [];
				var hasSavedDesktop = false;
				try {
					var savedCanvases = JSON.parse(localStorage.getItem(canvasStorageKey) || 'null');
					var savedDesktop = JSON.parse(localStorage.getItem(chartGridStorageKey) || 'null');
					if (savedCanvases && Array.isArray(savedCanvases.canvases) &&
						savedCanvases.canvases.some(function (canvas) {
							return canvas && typeof canvas.id === 'string' && !canvas.mfpTerminal;
						})) {
						workspaceCanvases = savedCanvases.canvases.filter(function (canvas) {
							return canvas && typeof canvas.id === 'string';
						}).filter(function (canvas) {
							return !canvas.mfpTerminal;
						}).map(function (canvas, index) {
							return {
								id: canvas.id,
								name: typeof canvas.name === 'string' ? canvas.name : 'Canvas ' + (index + 1),
								open: Array.isArray(canvas.open) ? canvas.open.filter(function (chartIndex) {
									return Number.isInteger(chartIndex) && chartIndex >= 0;
								}) : [],
								rects: canvas.rects && typeof canvas.rects === 'object' ? canvas.rects : {},
								minimized: Array.isArray(canvas.minimized) ? canvas.minimized : [],
								toolbar: Number.isInteger(canvas.toolbar) ? canvas.toolbar : -1,
								calendarOpen: Boolean(canvas.calendarOpen),
							};
						});
						activeCanvasId = workspaceCanvases.some(function (canvas) {
							return canvas.id === savedCanvases.activeId;
						}) ? savedCanvases.activeId : workspaceCanvases[0].id;
						nextCanvasId = workspaceCanvases.reduce(function (nextId, canvas) {
							var match = canvas.id.match(/^canvas-(\d+)$/);
							return match ? Math.max(nextId, Number(match[1]) + 1) : nextId;
						}, 1);
						hasSavedDesktop = true;
					} else if (savedDesktop && Array.isArray(savedDesktop.open)) {
						hasSavedDesktop = true;
						visibleChartIndexes = Array.from(new Set(savedDesktop.open.filter(function (index) {
							return Number.isInteger(index) && index >= 0 && index < maxChartWindows;
						})));
						chartWindowRects = savedDesktop.rects && typeof savedDesktop.rects === 'object' ?
							savedDesktop.rects : {};
						minimizedChartIndexes = Array.isArray(savedDesktop.minimized) ?
							savedDesktop.minimized.filter(function (index) {
								return Number.isInteger(index) && index >= 0 && index < maxChartWindows;
							}) : [];
						workspaceCanvases = [{
							id: activeCanvasId,
							name: 'Canvas 1',
							open: visibleChartIndexes,
							rects: chartWindowRects,
							minimized: minimizedChartIndexes,
							toolbar: visibleChartIndexes.length ? visibleChartIndexes[0] : -1,
							calendarOpen: false,
						}];
					}
				} catch (error) {
					console.error('Unable to restore chart workspace:', error);
				}
				if (!workspaceCanvases.length) {
					workspaceCanvases = [{
						id: activeCanvasId, name: 'Canvas 1', open: visibleChartIndexes,
						rects: chartWindowRects, minimized: minimizedChartIndexes,
						toolbar: visibleChartIndexes.length ? visibleChartIndexes[0] : -1, calendarOpen: false,
					}];
				}
				var initialCanvas = workspaceCanvases.find(function (canvas) { return canvas.id === activeCanvasId; });
				visibleChartIndexes = initialCanvas.open;
				chartWindowRects = initialCanvas.rects;
				minimizedChartIndexes = initialCanvas.minimized;
				if (!hasSavedDesktop && !visibleChartIndexes.includes(0)) { visibleChartIndexes.unshift(0); }
				var toolbarChartIndex = initialCanvas.toolbar >= 0 ? initialCanvas.toolbar :
					(visibleChartIndexes.length ? visibleChartIndexes[0] : -1);
				chartGrid.dataset.canvasId = activeCanvasId;
				var defaultChartSymbols = ['NQ.F', 'ES.F', 'GC.F', 'FDAX.F'];
				document.documentElement.dataset.theme = initialTheme;

				var chartDatafeed = new LSELiveDatafeed(datafeedUrl);
				var widgetOptions = {
					fullscreen: false,
					autosize: true,
					symbol: 'NQ.F',
					interval: '1',
					timezone: 'America/New_York',
					container: "tv_chart_container",
					datafeed: chartDatafeed.createClient(0),
					library_path: "charting_library/",
					locale: getParameterByName('lang') || "en",
					disabled_features: ["use_localstorage_for_settings"],
					enabled_features: [
						"study_templates",
						"seconds_resolution",
						"custom_resolutions",
					],
					favorites: {
						drawingTools: [
							"LineToolTrendLine",
							"LineToolHorzLine",
							"LineToolHorzRay",
							"LineToolFibRetracement",
							"LineToolRectangle",
							"LineToolText",
						],
					},
					auto_save_delay: 1,
					custom_indicators_getter: function (PineJS) {
						return Promise.resolve([window.AverageHourlyRangeBands(PineJS)]);
					},
					theme: 'Dark',
					overrides: {
						"paneProperties.backgroundType": "solid",
						"paneProperties.background": 'rgba(11, 16, 18, 0)',
						"paneProperties.vertGridProperties.color": 'rgba(178, 194, 186, 0.10)',
						"paneProperties.horzGridProperties.color": 'rgba(178, 194, 186, 0.10)',
					},
					charts_storage_url: 'https://saveload.tradingview.com',
					charts_storage_api_version: "1.1",
					client_id: 'tradingview.com',
					user_id: 'public_user_id',
				};
				var widget;

				function chartStateStorageKey(index) {
					return index === 0 ? chartLayoutStorageKey : chartLayoutStorageKey + '-chart-' + index;
				}

				function saveChartLayout(chartWidget, index) {
					if (!readyChartIndexes.has(index)) { return; }
					try {
						chartWidget.save(function (state) {
							try {
								localStorage.setItem(chartStateStorageKey(index), JSON.stringify(state));
							} catch (error) {
								console.error('Unable to save chart layout:', error);
							}
						}, { includeDrawings: true });
					} catch (error) {
						console.error('Unable to save chart layout:', error);
					}
				}

				window.addEventListener('pagehide', function () {
					chartWidgets.forEach(function (chartWidget, index) {
						if (chartWidget) { saveChartLayout(chartWidget, index); }
					});
				});

				var activeSymbol = 'NQ.F';
				var watchItems = document.getElementById('watch-items');
				var searchInput = document.getElementById('watch-search');
				var searchResults = document.getElementById('search-results');
				var watchSearchWrap = document.getElementById('watch-search-wrap');
				var watchSearchToggle = document.getElementById('watch-search-toggle');
				var tickTapeToggle = document.getElementById('tick-tape-toggle');
				var tickTape = document.getElementById('tick-tape');
				var tickTapeClose = document.getElementById('tick-tape-close');
				var tickTapeStatus = document.getElementById('tick-tape-status');
				var tickTapeItems = document.getElementById('tick-tape-items');
				var tickTapeSource = null;
				var searchTimer;
				var quoteStreams = new Map();
				var quoteData = new Map();
				var quoteHistoryRequests = new Set();
				var watchlistStorageKey = 'lse-watchlist';
				var futuresWatchlistMigrationKey = 'lse-watchlist-futures-added-v1';
				var additionalFutures = [
					{ symbol: 'FDAX.F', name: 'DAX Futures' },
					{ symbol: 'FESX.F', name: 'EURO STOXX 50' },
					{ symbol: 'FGBL.F', name: 'Euro-Bund Futures' },
					{ symbol: 'SI.F', name: 'Silver Futures' },
				];
				var defaultWatchlist = [
					{ symbol: 'NQ.F', name: 'NASDAQ 100' },
					{ symbol: 'ES.F', name: 'S&P 500' },
					{ symbol: 'GC.F', name: 'GOLD' },
					{ symbol: 'FDAX.F', name: 'DAX Futures' },
					{ symbol: 'FESX.F', name: 'EURO STOXX 50' },
					{ symbol: 'FGBL.F', name: 'Euro-Bund Futures' },
					{ symbol: 'SI.F', name: 'Silver Futures' },
				];
				var watchlist;
				try {
					watchlist = JSON.parse(localStorage.getItem(watchlistStorageKey) || 'null') || defaultWatchlist;
				} catch (error) {
					watchlist = defaultWatchlist;
				}
				if (localStorage.getItem(futuresWatchlistMigrationKey) !== 'true') {
					additionalFutures.forEach(function (item) {
						if (!watchlist.some(function (entry) { return entry.symbol === item.symbol; })) {
							watchlist.push(item);
						}
					});
					localStorage.setItem(watchlistStorageKey, JSON.stringify(watchlist));
					localStorage.setItem(futuresWatchlistMigrationKey, 'true');
				}

				function displaySymbol(symbol) {
					return symbol.replace(/\.F$/i, '');
				}

				function updateSymbol(symbol) {
					activeSymbol = symbol;
					watchItems.querySelectorAll('[data-symbol]').forEach(function (button) {
						var active = button.dataset.symbol === symbol;
						button.classList.toggle('is-active', active);
						button.setAttribute('aria-pressed', String(active));
					});
					updateChartSelectors();
				}

				function selectSymbol(symbol) {
					if (activeWidgetIndex < 0) { return; }
					if (readyChartIndexes.has(activeWidgetIndex)) {
						widget.activeChart().setSymbol(symbol);
					} else {
						pendingSymbols.set(activeWidgetIndex, symbol);
					}
				}

				function updateChartSelectors() {
					activeChartSelect.replaceChildren();
					visibleChartIndexes.forEach(function (index) {
						var chartWidget = chartWidgets[index];
						var chartSymbol = readyChartIndexes.has(index) ?
							chartWidget.activeChart().symbol() : defaultChartSymbols[index];
						var option = document.createElement('option');
						option.value = String(index);
						option.textContent = 'Chart ' + (index + 1) + ' · ' + displaySymbol(chartSymbol);
						activeChartSelect.append(option);
					});
					activeChartSelect.value = String(activeWidgetIndex);
					document.getElementById('chart-layout-status').textContent = visibleChartIndexes.length ?
						visibleChartIndexes.length + ' CHART WINDOWS · ACTIVE ' + (activeWidgetIndex + 1) :
						'EMPTY CANVAS';
				}

				function activeCanvas() {
					return workspaceCanvases.find(function (canvas) { return canvas.id === activeCanvasId; });
				}

				function canvasGrid(canvas) {
					var existingGrid = chartFrame.querySelector('[data-canvas-id="' + canvas.id + '"]');
					if (existingGrid) { return existingGrid; }
					var grid = document.createElement('div');
					grid.className = 'canvas-grid';
					grid.id = 'chart-grid-' + canvas.id;
					grid.dataset.canvasId = canvas.id;
					grid.hidden = true;
					chartFrame.append(grid);
					return grid;
				}

				function renderCanvasTabs() {
					canvasTabs.replaceChildren();
					workspaceCanvases.forEach(function (canvas, index) {
						canvas.name = 'Canvas ' + (index + 1);
						var tabGroup = document.createElement('div');
						tabGroup.className = 'canvas-tab-group' + (canvas.id === activeCanvasId ? ' is-active' : '');
						var tab = document.createElement('button');
						tab.type = 'button';
						tab.className = 'canvas-tab';
						tab.setAttribute('aria-pressed', String(canvas.id === activeCanvasId));
						tab.title = 'Switch to ' + canvas.name;
						tab.textContent = canvas.name;
						tab.addEventListener('click', function () { switchCanvas(canvas.id); });
						tabGroup.append(tab);
						if (workspaceCanvases.length > 1) {
							var closeButton = document.createElement('button');
							closeButton.type = 'button';
							closeButton.className = 'canvas-tab-close';
							closeButton.setAttribute('aria-label', 'Close ' + canvas.name);
							closeButton.title = 'Close ' + canvas.name;
							closeButton.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg>';
							closeButton.addEventListener('click', function (event) {
								event.stopPropagation();
								removeCanvas(canvas.id);
							});
							tabGroup.append(closeButton);
						}
						canvasTabs.append(tabGroup);
					});
					canvasTabs.append(addCanvasButton);
				}

				function saveCurrentCanvasState() {
					var canvas = activeCanvas();
					if (!canvas) { return; }
					canvas.open = visibleChartIndexes.slice();
					canvas.rects = chartWindowRects;
					canvas.minimized = visibleChartIndexes.filter(function (index) {
						var cell = document.getElementById('chart-cell-' + index);
						return cell && cell.classList.contains('is-minimized');
					});
					canvas.toolbar = toolbarChartIndex;
					canvas.calendarOpen = Boolean(chartGrid.querySelector('.calendar-app-window'));
				}

				function switchCanvas(canvasId) {
					if (canvasId === activeCanvasId) { return; }
					saveCurrentCanvasState();
					chartGrid.hidden = true;
					var canvas = workspaceCanvases.find(function (item) { return item.id === canvasId; });
					if (!canvas) { return; }
					activeCanvasId = canvas.id;
					visibleChartIndexes = canvas.open;
					chartWindowRects = canvas.rects;
					minimizedChartIndexes = canvas.minimized;
					toolbarChartIndex = canvas.toolbar >= 0 ? canvas.toolbar :
						(visibleChartIndexes.length ? visibleChartIndexes[0] : -1);
					chartGrid = canvasGrid(canvas);
					chartGrid.hidden = false;
					calendarAppWindow = chartGrid.querySelector('.calendar-app-window');
					visibleChartIndexes.forEach(function (index) { ensureChartWidget(index); });
					activeWidgetIndex = -1;
					if (visibleChartIndexes.length) { setChartWindowActive(visibleChartIndexes[0]); }
					else { setActiveChartWidget(-1); }
					renderCanvasTabs();
					updateChartSelectors();
					saveChartDesktop();
				}

				function addCanvas() {
					saveCurrentCanvasState();
					var canvas = {
						id: 'canvas-' + nextCanvasId,
						name: 'Canvas ' + (workspaceCanvases.length + 1),
						open: [], rects: {}, minimized: [], toolbar: -1, calendarOpen: false,
					};
					nextCanvasId += 1;
					workspaceCanvases.push(canvas);
					canvasGrid(canvas);
					switchCanvas(canvas.id);
				}

				function removeCanvas(canvasId) {
					if (workspaceCanvases.length <= 1) { return; }
					var canvas = workspaceCanvases.find(function (item) { return item.id === canvasId; });
					if (!canvas) { return; }
					if (canvas.id === activeCanvasId) {
						var replacement = workspaceCanvases.find(function (item) { return item.id !== canvasId; });
						switchCanvas(replacement.id);
					}
					clearDrawingMirrors();
					canvas.open.forEach(function (index) {
						var chartWidget = chartWidgets[index];
						if (chartWidget) {
							saveChartLayout(chartWidget, index);
							chartWidget.remove();
						}
						var cell = document.getElementById('chart-cell-' + index);
						if (cell) { cell.remove(); }
						chartWidgets[index] = null;
						readyChartIndexes.delete(index);
						pendingSymbols.delete(index);
						localStorage.removeItem(chartStateStorageKey(index));
					});
					var grid = chartFrame.querySelector('[data-canvas-id="' + canvas.id + '"]');
					if (grid) { grid.remove(); }
					workspaceCanvases = workspaceCanvases.filter(function (item) { return item.id !== canvasId; });
					renderCanvasTabs();
					saveChartDesktop();
				}

				function setActiveChartWidget(index) {
					if (index === -1 && visibleChartIndexes.length === 0) {
						activeWidgetIndex = -1;
						widget = null;
						window.tvWidget = null;
						updateChartSelectors();
						return;
					}
					if (!visibleChartIndexes.includes(index)) { return; }
					activeWidgetIndex = index;
					widget = chartWidgets[index];
					window.tvWidget = widget;
					if (readyChartIndexes.has(index)) {
						activeSymbol = widget.activeChart().symbol();
						updateSymbol(activeSymbol);
						if (!tickTape.hidden) { startTickTape(activeSymbol); }
					} else {
						activeSymbol = defaultChartSymbols[index];
						updateSymbol(activeSymbol);
					}
				}

				var drawingSyncInProgress = 0;

				function drawingRecordKey(index, entityId) {
					return index + ':' + entityId;
				}

				function removeDrawingMirror(record, chartIndex) {
					var entityId = record.mirrors.get(chartIndex);
					if (entityId === undefined) { return; }
					record.mirrors.delete(chartIndex);
					mirroredDrawingIds.delete(chartIndex + ':' + entityId);
					if (readyChartIndexes.has(chartIndex)) {
						drawingSyncInProgress += 1;
						try { chartWidgets[chartIndex].activeChart().removeEntity(entityId); }
						finally { drawingSyncInProgress -= 1; }
					}
				}

				function clearDrawingMirrors() {
					drawingMirrorRegistry.forEach(function (record) {
						Array.from(record.mirrors.keys()).forEach(function (chartIndex) {
							removeDrawingMirror(record, chartIndex);
						});
					});
					drawingMirrorRegistry.clear();
				}

				function drawingShapeName(name) {
					return String(name)
						.replace(/^LineTool/, '')
						.replace(/([a-z0-9])([A-Z])/g, '$1_$2')
						.replace(/[^a-zA-Z0-9]+/g, '_')
						.replace(/^_+|_+$/g, '')
						.toLowerCase();
				}

				function drawingSnapshot(chart, info) {
					var shape = chart.getShapeById(info.id);
					var anchoredPosition = shape.getAnchoredPosition();
					return {
						name: info.name,
						shape: drawingShapeName(info.name),
						points: anchoredPosition ? null : shape.getPoints(),
						anchoredPosition: anchoredPosition || null,
						properties: shape.getProperties(),
						selectionEnabled: shape.isSelectionEnabled(),
					};
				}

				async function createDrawingMirror(chart, snapshot) {
					var options = {
						shape: snapshot.shape,
						overrides: snapshot.properties,
						disableUndo: true,
						disableSave: true,
					};
					var entityId;
					if (snapshot.anchoredPosition) {
						entityId = await chart.createAnchoredShape(snapshot.anchoredPosition, options);
					} else if (snapshot.points.length === 1) {
						entityId = await chart.createShape(snapshot.points[0], options);
					} else {
						entityId = await chart.createMultipointShape(snapshot.points, options);
					}
					var mirror = chart.getShapeById(entityId);
					mirror.setSelectionEnabled(snapshot.selectionEnabled);
					return entityId;
				}

				async function synchronizeDrawing(sourceIndex, entityId, eventType) {
					if (!drawingSyncEnabled || drawingSyncInProgress ||
						!readyChartIndexes.has(sourceIndex)) { return; }
					var sourceChart = chartWidgets[sourceIndex].activeChart();
					var key = drawingRecordKey(sourceIndex, entityId);
					var record = drawingMirrorRegistry.get(key);
					var info = sourceChart.getAllShapes().find(function (shapeInfo) {
						return shapeInfo.id === entityId;
					});
					if (eventType === 'remove' || !info) {
						if (record) {
							Array.from(record.mirrors.keys()).forEach(function (chartIndex) {
								removeDrawingMirror(record, chartIndex);
							});
							drawingMirrorRegistry.delete(key);
						}
						return;
					}
					var shape = sourceChart.getShapeById(entityId);
					if (!shape.isSavingEnabled()) { return; }
					var snapshot;
					try {
						snapshot = drawingSnapshot(sourceChart, info);
					} catch (error) {
						console.warn('Unable to synchronize drawing:', error);
						return;
					}
					if (record) {
						Array.from(record.mirrors.keys()).forEach(function (chartIndex) {
							removeDrawingMirror(record, chartIndex);
						});
					} else {
						record = { sourceIndex: sourceIndex, sourceId: entityId, mirrors: new Map() };
						drawingMirrorRegistry.set(key, record);
					}
					record.sourceSymbol = sourceChart.symbol();
					for (var visibleIndex = 0; visibleIndex < visibleChartIndexes.length; visibleIndex += 1) {
						var chartIndex = visibleChartIndexes[visibleIndex];
						if (chartIndex === sourceIndex || !readyChartIndexes.has(chartIndex) ||
							chartWidgets[chartIndex].activeChart().symbol() !== record.sourceSymbol) { continue; }
						try {
							drawingSyncInProgress += 1;
							var mirrorId = await createDrawingMirror(
								chartWidgets[chartIndex].activeChart(),
								snapshot,
							);
							record.mirrors.set(chartIndex, mirrorId);
							mirroredDrawingIds.add(chartIndex + ':' + mirrorId);
						} catch (error) {
							console.warn('Unable to mirror drawing to chart ' + (chartIndex + 1) + ':', error);
						} finally {
							drawingSyncInProgress -= 1;
						}
					}
				}

				function scheduleDrawingSync(chartIndex, entityId, eventType) {
					var key = chartIndex + ':' + entityId;
					window.clearTimeout(drawingSyncTimers.get(key));
					drawingSyncTimers.set(key, window.setTimeout(function () {
						drawingSyncTimers.delete(key);
						synchronizeDrawing(chartIndex, entityId, eventType);
					}, 60));
				}

				function synchronizeAllDrawings() {
					if (!drawingSyncEnabled) { return; }
					clearDrawingMirrors();
					chartWidgets.forEach(function (chartWidget, chartIndex) {
						if (!chartWidget || !readyChartIndexes.has(chartIndex)) { return; }
						chartWidget.activeChart().getAllShapes().forEach(function (shapeInfo) {
							scheduleDrawingSync(chartIndex, shapeInfo.id, 'create');
						});
					});
				}

				function findDrawingMirror(chartIndex, entityId) {
					var match = null;
					drawingMirrorRegistry.forEach(function (record) {
						if (record.mirrors.get(chartIndex) === entityId) { match = record; }
					});
					return match;
				}

				function propagateMirroredDrawingChange(chartIndex, entityId, eventType) {
					var record = findDrawingMirror(chartIndex, entityId);
					if (!record || !readyChartIndexes.has(record.sourceIndex)) { return; }
					var sourceChart = chartWidgets[record.sourceIndex].activeChart();
					if (eventType === 'remove') {
						sourceChart.removeEntity(record.sourceId);
						return;
					}
					try {
						var sourceShape = sourceChart.getShapeById(record.sourceId);
						var mirrorChart = chartWidgets[chartIndex].activeChart();
						var mirrorInfo = mirrorChart.getAllShapes().find(function (shapeInfo) {
							return shapeInfo.id === entityId;
						});
						if (!mirrorInfo) { return; }
						var mirrorShape = mirrorChart.getShapeById(entityId);
						var anchoredPosition = mirrorShape.getAnchoredPosition();
						if (anchoredPosition) {
							sourceShape.setAnchoredPosition(anchoredPosition);
						} else {
							sourceShape.setPoints(mirrorShape.getPoints());
						}
						sourceShape.setProperties(mirrorShape.getProperties());
					} catch (error) {
						console.warn('Unable to apply a synchronized drawing edit:', error);
					}
				}

				function createChartCell(index) {
					var cell = document.createElement('div');
					cell.className = 'chart-grid-cell' + (index === toolbarChartIndex ? ' has-drawing-toolbar' : '');
					cell.id = 'chart-cell-' + index;
					cell.dataset.chartIndex = String(index);
					cell.style.zIndex = String(index + 1);
					var titlebar = document.createElement('div');
					titlebar.className = 'chart-window-titlebar';
					titlebar.title = 'Click and hold the title bar to move this chart';
					titlebar.innerHTML = '<div class="chart-window-drag-handle" title="Hold and drag to move"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="4" r=".7"/><circle cx="11" cy="4" r=".7"/><circle cx="5" cy="8" r=".7"/><circle cx="11" cy="8" r=".7"/><circle cx="5" cy="12" r=".7"/><circle cx="11" cy="12" r=".7"/></svg></div><strong></strong><div class="chart-window-actions"></div>';
					titlebar.querySelector('strong').textContent = 'CHART ' + (index + 1);
					var actions = titlebar.querySelector('.chart-window-actions');
					var minimizeButton = document.createElement('button');
					minimizeButton.type = 'button';
					minimizeButton.className = 'chart-window-button';
					minimizeButton.setAttribute('aria-label', 'Minimize chart ' + (index + 1));
					minimizeButton.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 11.5h10"/></svg>';
					minimizeButton.addEventListener('click', function (event) {
						event.stopPropagation();
						toggleChartMinimized(index, cell, minimizeButton);
					});
					var maximizeButton = document.createElement('button');
					maximizeButton.type = 'button';
					maximizeButton.className = 'chart-window-button';
					maximizeButton.setAttribute('aria-label', 'Maximize chart ' + (index + 1));
					maximizeButton.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.25" y="3.25" width="9.5" height="9.5" rx="1"/></svg>';
					maximizeButton.addEventListener('click', function (event) {
						event.stopPropagation();
						if (cell.classList.contains('is-maximized')) {
							cell.classList.remove('is-maximized');
							applyChartWindowRect(cell, chartWindowRects[index] || defaultChartRect(index));
						} else {
							chartWindowRects[index] = readChartWindowRect(cell);
							cell.classList.add('is-maximized');
						}
						saveChartDesktop();
					});
					var closeButton = document.createElement('button');
					closeButton.type = 'button';
					closeButton.className = 'chart-window-button chart-window-close';
					closeButton.setAttribute('aria-label', 'Close chart ' + (index + 1));
					closeButton.title = 'Close chart';
					closeButton.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg>';
					closeButton.addEventListener('click', function (event) {
						event.stopPropagation();
						closeChartWindow(index);
					});
					if (minimizedChartIndexes.includes(index)) {
						cell.classList.add('is-minimized');
						minimizeButton.setAttribute('aria-label', 'Restore chart ' + (index + 1));
						minimizeButton.title = 'Restore chart';
						minimizeButton.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg>';
					}
					actions.append(minimizeButton, maximizeButton, closeButton);
					cell.append(titlebar);
					titlebar.addEventListener('click', function (event) {
						if (cell.classList.contains('is-minimized') && !event.target.closest('button')) {
							restoreChartWindow(index, cell, minimizeButton);
						}
					});
					var container = document.createElement('div');
					container.id = 'tv_chart_container_' + index;
					container.className = 'chart-window-content';
					cell.append(container);
					['n', 'e', 's', 'w', 'ne', 'se', 'sw', 'nw'].forEach(function (direction) {
						var resizeHandle = document.createElement('div');
						resizeHandle.className = 'chart-window-resize resize-' + direction;
						resizeHandle.dataset.direction = direction;
						resizeHandle.title = 'Drag to resize chart';
						resizeHandle.setAttribute('aria-hidden', 'true');
						resizeHandle.addEventListener('pointerdown', function (event) {
							beginChartWindowResize(index, cell, direction, event);
						});
						cell.append(resizeHandle);
					});
					cell.addEventListener('pointerdown', function () {
						setChartWindowActive(index);
					});
					titlebar.addEventListener('pointerdown', function (event) {
						if (event.button !== 0 || event.target.closest('button') ||
							cell.classList.contains('is-maximized') ||
							cell.classList.contains('is-minimized')) { return; }
						event.preventDefault();
						titlebar.setPointerCapture(event.pointerId);
						setChartWindowActive(index);
						cell.classList.add('is-moving');
						var startX = event.clientX;
						var startY = event.clientY;
						var startRect = readChartWindowRect(cell);
						var moveFinished = false;
						function moveWindow(moveEvent) {
							if (moveEvent.pointerId !== event.pointerId) { return; }
							if ((moveEvent.buttons & 1) === 0) {
								finishMove();
								return;
							}
							var next = Object.assign({}, startRect, {
								x: startRect.x + moveEvent.clientX - startX,
								y: startRect.y + moveEvent.clientY - startY,
							});
							applyChartWindowRect(cell, next);
						}
						function finishMove() {
							if (moveFinished) { return; }
							moveFinished = true;
							window.removeEventListener('pointermove', moveWindow);
							window.removeEventListener('pointerup', finishMove);
							window.removeEventListener('pointercancel', finishMove);
							if (titlebar.hasPointerCapture(event.pointerId)) {
								titlebar.releasePointerCapture(event.pointerId);
							}
							cell.classList.remove('is-moving');
							var movedRect = readChartWindowRect(cell);
							if (cell.classList.contains('is-minimized')) {
								movedRect.height = (chartWindowRects[index] || startRect).height;
							}
							chartWindowRects[index] = movedRect;
							saveChartDesktop();
						}
						window.addEventListener('pointermove', moveWindow);
						window.addEventListener('pointerup', finishMove);
						window.addEventListener('pointercancel', finishMove);
					});
					titlebar.addEventListener('contextmenu', function (event) {
						event.preventDefault();
					});
					chartGrid.append(cell);
					return container.id;
				}

				function defaultChartRect(index) {
					var bounds = chartGrid.getBoundingClientRect();
					return {
						x: Math.min(bounds.width * (0.04 + index * 0.035), Math.max(0, bounds.width - 320)),
						y: Math.min(bounds.height * (0.04 + index * 0.035), Math.max(0, bounds.height - 240)),
						width: Math.min(bounds.width * 0.72, bounds.width),
						height: Math.min(bounds.height * 0.82, bounds.height),
					};
				}

				function readChartWindowRect(cell) {
					var gridBounds = chartGrid.getBoundingClientRect();
					var bounds = cell.getBoundingClientRect();
					return {
						x: bounds.left - gridBounds.left,
						y: bounds.top - gridBounds.top,
						width: bounds.width,
						height: bounds.height,
					};
				}

				function applyChartWindowRect(cell, rect) {
					var gridBounds = chartGrid.getBoundingClientRect();
					var width = Math.max(220, Number(rect.width) || gridBounds.width * 0.7);
					var height = Math.max(160, Number(rect.height) || gridBounds.height * 0.8);
					var x = Math.max(0, Math.min(Number(rect.x) || 0, Math.max(0, gridBounds.width - 96)));
					var y = Math.max(0, Math.min(Number(rect.y) || 0, Math.max(0, gridBounds.height - 31)));
					cell.style.left = x + 'px';
					cell.style.top = y + 'px';
					cell.style.width = width + 'px';
					cell.style.height = height + 'px';
				}

				function toggleChartMinimized(index, cell, button) {
					if (cell.classList.contains('is-minimized')) {
						restoreChartWindow(index, cell, button);
						return;
					}
					chartWindowRects[index] = readChartWindowRect(cell);
					cell.classList.remove('is-maximized');
					cell.classList.add('is-minimized');
					button.setAttribute('aria-label', 'Restore chart ' + (index + 1));
					button.title = 'Restore chart';
					button.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg>';
					saveChartDesktop();
				}

				function restoreChartWindow(index, cell, button) {
					cell.classList.remove('is-minimized', 'is-maximized');
					applyChartWindowRect(cell, chartWindowRects[index] || defaultChartRect(index));
					cell.style.zIndex = String(nextCanvasZIndex());
					button.setAttribute('aria-label', 'Minimize chart ' + (index + 1));
					button.title = 'Minimize chart';
					button.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 11.5h10"/></svg>';
					setChartWindowActive(index);
					saveChartDesktop();
				}

				function beginChartWindowResize(index, cell, direction, event) {
					if (event.button !== 0 || cell.classList.contains('is-maximized') ||
						cell.classList.contains('is-minimized')) { return; }
					event.preventDefault();
					event.stopPropagation();
					var resizeHandle = event.currentTarget;
					resizeHandle.setPointerCapture(event.pointerId);
					setChartWindowActive(index);
					var startX = event.clientX;
					var startY = event.clientY;
					var startRect = readChartWindowRect(cell);
					var resizeFinished = false;
					function resizeWindow(moveEvent) {
						if (moveEvent.pointerId !== event.pointerId) { return; }
						if ((moveEvent.buttons & 1) === 0) {
							finishResize();
							return;
						}
						var dx = moveEvent.clientX - startX;
						var dy = moveEvent.clientY - startY;
						var bounds = chartGrid.getBoundingClientRect();
						var minWidth = Math.min(220, bounds.width);
						var minHeight = Math.min(160, bounds.height);
						var next = Object.assign({}, startRect);
						if (direction.includes('e')) {
							next.width = Math.max(minWidth, Math.min(startRect.width + dx, bounds.width - startRect.x));
						}
						if (direction.includes('s')) {
							next.height = Math.max(minHeight, Math.min(startRect.height + dy, bounds.height - startRect.y));
						}
						if (direction.includes('w')) {
							next.x = Math.max(0, Math.min(startRect.x + dx, startRect.x + startRect.width - minWidth));
							next.width = startRect.width + startRect.x - next.x;
						}
						if (direction.includes('n')) {
							next.y = Math.max(0, Math.min(startRect.y + dy, startRect.y + startRect.height - minHeight));
							next.height = startRect.height + startRect.y - next.y;
						}
						applyChartWindowRect(cell, next);
					}
					function finishResize() {
						if (resizeFinished) { return; }
						resizeFinished = true;
						window.removeEventListener('pointermove', resizeWindow);
						window.removeEventListener('pointerup', finishResize);
						window.removeEventListener('pointercancel', finishResize);
						if (resizeHandle.hasPointerCapture(event.pointerId)) {
							resizeHandle.releasePointerCapture(event.pointerId);
						}
						chartWindowRects[index] = readChartWindowRect(cell);
						saveChartDesktop();
					}
					window.addEventListener('pointermove', resizeWindow);
					window.addEventListener('pointerup', finishResize);
					window.addEventListener('pointercancel', finishResize);
				}

				function setChartWindowActive(index) {
					Array.from(chartGrid.children).forEach(function (item) {
						item.classList.toggle('is-active', Number(item.dataset.chartIndex) === index);
					});
					var cell = document.getElementById('chart-cell-' + index);
					if (cell) {
						cell.style.zIndex = String(nextCanvasZIndex());
					}
					setActiveChartWidget(index);
				}

				function nextCanvasZIndex() {
					return Math.max.apply(null, [10].concat(Array.from(chartGrid.children).map(function (item) {
						return Number(item.style.zIndex) || 1;
					}))) + 1;
				}

				function saveChartDesktop() {
					saveCurrentCanvasState();
					try {
						localStorage.setItem(canvasStorageKey, JSON.stringify({
							activeId: activeCanvasId,
							canvases: workspaceCanvases,
						}));
						localStorage.setItem(chartGridStorageKey, JSON.stringify({
							open: visibleChartIndexes,
							rects: chartWindowRects,
							minimized: visibleChartIndexes.filter(function (index) {
								var cell = document.getElementById('chart-cell-' + index);
								return cell && cell.classList.contains('is-minimized');
							}),
						}));
					} catch (error) {
						console.error('Unable to save chart workspace:', error);
					}
				}

				function closeChartWindow(index) {
					if (!visibleChartIndexes.includes(index)) { return; }
					clearDrawingMirrors();
					var chartWidget = chartWidgets[index];
					if (chartWidget) {
						saveChartLayout(chartWidget, index);
						chartWidget.remove();
					}
					var cell = document.getElementById('chart-cell-' + index);
					if (cell) { cell.remove(); }
					chartWidgets[index] = null;
					readyChartIndexes.delete(index);
					pendingSymbols.delete(index);
					visibleChartIndexes = visibleChartIndexes.filter(function (visibleIndex) {
						return visibleIndex !== index;
					});
					if (toolbarChartIndex === index) {
						toolbarChartIndex = visibleChartIndexes.length ? visibleChartIndexes[0] : -1;
						if (toolbarChartIndex !== -1) {
							var promotedIndex = toolbarChartIndex;
							var promotedWidget = chartWidgets[promotedIndex];
							if (promotedWidget) {
								saveChartLayout(promotedWidget, promotedIndex);
								promotedWidget.remove();
							}
							var promotedCell = document.getElementById('chart-cell-' + promotedIndex);
							if (promotedCell) { promotedCell.remove(); }
							chartWidgets[promotedIndex] = null;
							readyChartIndexes.delete(promotedIndex);
							ensureChartWidget(promotedIndex);
							if (activeWidgetIndex === promotedIndex) { setChartWindowActive(promotedIndex); }
						}
					}
					if (activeWidgetIndex === index) {
						if (visibleChartIndexes.length) { setChartWindowActive(visibleChartIndexes[0]); }
						else { setActiveChartWidget(-1); }
					}
					if (!visibleChartIndexes.length) { toolbarChartIndex = -1; }
					updateChartSelectors();
					if (drawingSyncEnabled) { synchronizeAllDrawings(); }
					saveChartDesktop();
				}

				function addChartWindow() {
					if (visibleChartIndexes.length >= maxChartWindows) {
						document.getElementById('chart-layout-status').textContent = 'MAXIMUM ' + maxChartWindows + ' CHARTS';
						return;
					}
					var index = -1;
					var usedIndexes = new Set(workspaceCanvases.reduce(function (indexes, canvas) {
						return indexes.concat(canvas.open);
					}, []));
					for (var candidate = 0; index === -1; candidate += 1) {
						if (!usedIndexes.has(candidate)) {
							index = candidate;
							break;
						}
					}
					if (toolbarChartIndex === -1) { toolbarChartIndex = index; }
					visibleChartIndexes.push(index);
					ensureChartWidget(index);
					setChartWindowActive(index);
					updateChartSelectors();
					saveChartDesktop();
				}

				function ensureChartWidget(index) {
					if (chartWidgets[index]) { return; }
					var containerId = createChartCell(index);
					var options = Object.assign({}, widgetOptions, {
						container: containerId,
						symbol: defaultChartSymbols[index % defaultChartSymbols.length],
						datafeed: chartDatafeed.createClient(index),
					});
					if (index !== toolbarChartIndex) {
						options.disabled_features = ["use_localstorage_for_settings", "header_widget", "left_toolbar"];
					}
					var chartWidget = new TradingView.widget(options);
					chartWidgets[index] = chartWidget;
					var savedRect = chartWindowRects[index] || defaultChartRect(index);
					applyChartWindowRect(document.getElementById('chart-cell-' + index), savedRect);
					registerChartWidget(chartWidget, index);
				}

				function registerChartWidget(chartWidget, index) {
					chartWidget.onChartReady(async function () {
						var chart = chartWidget.activeChart();
						var windowTitle = document.querySelector('#chart-cell-' + index + ' .chart-window-titlebar strong');
						if (windowTitle) {
							windowTitle.textContent = 'CHART ' + (index + 1) + ' · ' + displaySymbol(chart.symbol());
						}
						chartWidget.subscribe('onAutoSaveNeeded', function () {
							saveChartLayout(chartWidget, index);
						});
						chartWidget.subscribe('drawing_event', function (entityId, eventType) {
							if (!drawingSyncEnabled || drawingSyncInProgress) { return; }
							var mirroredKey = index + ':' + entityId;
							if (mirroredDrawingIds.has(mirroredKey)) {
								propagateMirroredDrawingChange(index, entityId, eventType);
								if (eventType === 'remove') {
									var mirrorRecord = findDrawingMirror(index, entityId);
									if (mirrorRecord) { mirrorRecord.mirrors.delete(index); }
									mirroredDrawingIds.delete(mirroredKey);
								}
								return;
							}
							scheduleDrawingSync(index, entityId, eventType);
						});
						chart.onSymbolChanged().subscribe(null, function (info) {
							updateChartSelectors();
							if (windowTitle) {
								windowTitle.textContent = 'CHART ' + (index + 1) + ' · ' + displaySymbol(info.ticker || info.name);
							}
							synchronizeAllDrawings();
							if (index !== activeWidgetIndex) { return; }
							var symbol = info.ticker || info.name;
							updateSymbol(symbol);
							if (!tickTape.hidden) { startTickTape(symbol); }
						});
						chart.onDataLoaded().subscribe(null, function () {
							var previousNames = [
								"Average Hourly & 4-Hour Range Bands",
								"Average Hourly Range Bands",
								"IV WALLS[D + W + H + 4H]",
							];
							var studies = chart.getAllStudies();
							studies.forEach(function (study) {
								if (previousNames.indexOf(study.name) !== -1) {
									chart.removeEntity(study.id);
								}
							});
							if (!studies.some(function (study) { return study.name === "NY 18:00 Hourly & 4-Hour Range Bands"; })) {
								chart.createStudy("NY 18:00 Hourly & 4-Hour Range Bands", false, false)
									.catch(function (error) { console.error('Unable to add hourly range bands:', error); });
							}
						}, true);
						try {
							var savedLayout = localStorage.getItem(chartStateStorageKey(index));
							if (savedLayout) {
								await chartWidget.load(JSON.parse(savedLayout));
							}
						} catch (error) {
							console.error('Unable to restore saved chart layout:', error);
						}
						readyChartIndexes.add(index);
						synchronizeAllDrawings();
						if (pendingSymbols.has(index)) {
							var pendingSymbol = pendingSymbols.get(index);
							pendingSymbols.delete(index);
							chart.setSymbol(pendingSymbol);
						}
						updateChartSelectors();
						if (index === activeWidgetIndex) {
							widget = chartWidget;
							window.tvWidget = chartWidget;
							activeSymbol = chart.symbol();
							updateSymbol(activeSymbol);
						}
					});
				}

				function saveWatchlist() {
					localStorage.setItem(watchlistStorageKey, JSON.stringify(watchlist));
				}

				function formatQuotePrice(value) {
					return new Intl.NumberFormat('en-US', {
						maximumFractionDigits: value >= 1000 ? 2 : 4,
					}).format(value);
				}

				function renderQuote(symbol) {
					var quote = quoteData.get(symbol);
					var select = Array.from(watchItems.querySelectorAll('[data-symbol]')).find(function (item) {
						return item.dataset.symbol === symbol;
					});
					if (!select || !quote) { return; }
					var price = select.querySelector('.watch-quote-price');
					var change = select.querySelector('.watch-quote-change');
					price.textContent = quote.last === null ? '—' : formatQuotePrice(quote.last);
					price.title = quote.last === null ? 'Waiting for a live trade' : formatQuotePrice(quote.last);
					if (quote.last === null || quote.previousClose === null || quote.previousClose === 0) {
						change.textContent = '—';
						change.classList.remove('is-positive', 'is-negative');
						return;
					}
					var percentage = (quote.last - quote.previousClose) / quote.previousClose * 100;
					change.textContent = (percentage > 0 ? '+' : '') + percentage.toFixed(2) + '%';
					change.classList.toggle('is-positive', percentage >= 0);
					change.classList.toggle('is-negative', percentage < 0);
				}

				function loadPreviousClose(symbol) {
					if (quoteData.has(symbol) || quoteHistoryRequests.has(symbol)) { return; }
					quoteHistoryRequests.add(symbol);
					var now = Math.floor(Date.now() / 1000);
					var url = new URL(datafeedUrl + '/history');
					url.searchParams.set('symbol', symbol);
					url.searchParams.set('resolution', '1D');
					url.searchParams.set('from', String(now - 14 * 86400));
					url.searchParams.set('to', String(now));
					url.searchParams.set('countback', '3');
					fetch(url.toString())
						.then(function (response) {
							if (!response.ok) { throw new Error('Quote history request failed for ' + symbol); }
							return response.json();
						})
						.then(function (history) {
							if (history.s === 'error') { throw new Error(history.errmsg); }
							if (history.s !== 'ok' || !history.c.length) { return; }
							var lastIndex = history.c.length - 1;
							var latestDate = new Date(history.t[lastIndex] * 1000);
							var today = new Date();
							var isCurrentDayBar = latestDate.getUTCFullYear() === today.getUTCFullYear() &&
								latestDate.getUTCMonth() === today.getUTCMonth() &&
								latestDate.getUTCDate() === today.getUTCDate();
							var previousIndex = isCurrentDayBar ? lastIndex - 1 : lastIndex;
							if (previousIndex < 0) { return; }
							var quote = quoteData.get(symbol) || {
								last: Number(history.c[lastIndex]),
								previousClose: null,
							};
							quote.previousClose = Number(history.c[previousIndex]);
							quoteData.set(symbol, quote);
							renderQuote(symbol);
						})
						.catch(function (error) { console.error('Watchlist quote:', error); })
						.finally(function () { quoteHistoryRequests.delete(symbol); });
				}

				function syncQuoteStreams() {
					var symbols = new Set(watchlist.map(function (item) { return item.symbol; }));
					quoteStreams.forEach(function (source, symbol) {
						if (!symbols.has(symbol)) {
							source.close();
							quoteStreams.delete(symbol);
							quoteData.delete(symbol);
						}
					});
					symbols.forEach(function (symbol) {
						loadPreviousClose(symbol);
						renderQuote(symbol);
						if (quoteStreams.has(symbol)) { return; }
						var streamUrl = new URL(datafeedUrl + '/stream');
						streamUrl.searchParams.set('symbol', symbol);
						streamUrl.searchParams.set('start', new Date().toISOString());
						var source = new EventSource(streamUrl.toString());
						source.onmessage = function (event) {
							var tick = JSON.parse(event.data);
							if (tick.error) {
								console.error('Watchlist live quote for ' + symbol + ':', tick.error);
								return;
							}
							var quote = quoteData.get(symbol) || { last: null, previousClose: null };
							quote.last = Number(tick.price);
							quoteData.set(symbol, quote);
							renderQuote(symbol);
						};
						source.onerror = function () {
							console.warn('Watchlist quote stream reconnecting for', symbol);
						};
						quoteStreams.set(symbol, source);
					});
				}

				function renderWatchlist() {
					watchItems.replaceChildren();
					document.getElementById('watch-count').textContent = String(watchlist.length).padStart(2, '0');
					watchlist.forEach(function (item) {
						var row = document.createElement('div');
						row.className = 'watch-row';
						var select = document.createElement('button');
						select.type = 'button';
						select.className = 'watch-select';
						select.dataset.symbol = item.symbol;
						select.setAttribute('aria-pressed', 'false');
						select.innerHTML = '<span class="watch-symbol"></span><span class="watch-description"></span><span class="watch-quote-price">—</span><span class="watch-quote-change">—</span>';
						select.querySelector('.watch-symbol').textContent = displaySymbol(item.symbol);
						select.querySelector('.watch-description').textContent = item.name;
						select.title = item.symbol + ' · ' + item.name;
						select.addEventListener('click', function () { selectSymbol(item.symbol); });
						var remove = document.createElement('button');
						remove.type = 'button';
						remove.className = 'watch-remove';
						remove.setAttribute('aria-label', 'Remove ' + item.symbol + ' from watchlist');
						remove.textContent = '−';
						remove.addEventListener('click', function () {
							watchlist = watchlist.filter(function (entry) { return entry.symbol !== item.symbol; });
						saveWatchlist();
						renderWatchlist();
						});
						row.append(select, remove);
						watchItems.append(row);
					});
					updateSymbol(activeSymbol);
					syncQuoteStreams();
				}

				function addToWatchlist(item) {
					if (!watchlist.some(function (entry) { return entry.symbol === item.symbol; })) {
						watchlist.push({ symbol: item.symbol, name: item.name || item.description || item.symbol });
						saveWatchlist();
						renderWatchlist();
					}
					setWatchSearchOpen(false);
					selectSymbol(item.symbol);
				}

				function setWatchSearchOpen(open) {
					watchSearchWrap.hidden = !open;
					watchSearchToggle.setAttribute('aria-expanded', String(open));
					if (open) {
						searchInput.focus();
					} else {
						searchInput.value = '';
						searchResults.replaceChildren();
					}
				}

				function startTickTape(symbol) {
					if (tickTapeSource) {
						tickTapeSource.close();
						tickTapeSource = null;
					}
					tickTapeItems.replaceChildren();
					tickTapeStatus.textContent = 'CONNECTING';
					var streamUrl = new URL(datafeedUrl + '/stream');
					streamUrl.searchParams.set('symbol', symbol);
					streamUrl.searchParams.set('start', new Date().toISOString());
					var source = new EventSource(streamUrl.toString());
					tickTapeSource = source;
					var symbolLabel = tickTape.querySelector('.tick-tape-symbol');
					symbolLabel.textContent = symbol;
					tickTape.setAttribute('aria-label', symbol + ' live tick tape');
					tickTapeToggle.title = 'Open live tick tape for ' + symbol;
					tickTapeToggle.setAttribute('aria-label', 'Open live tick tape for ' + symbol);
					source.onopen = function () {
						if (tickTapeSource === source) { tickTapeStatus.textContent = 'CONNECTED'; }
					};
					source.onmessage = function (event) {
						if (tickTapeSource !== source) { return; }
						try {
							var tick = JSON.parse(event.data);
							if (tick.error) {
								tickTapeStatus.textContent = 'FEED ERROR';
								console.error(symbol + ' tape:', tick.error);
								return;
							}
							var row = document.createElement('div');
							row.className = 'tick-tape-row';
							var time = document.createElement('time');
							var tickTime = Number(tick.timestamp_ms === undefined ? Number(tick.time) * 1000 : tick.timestamp_ms);
							var date = new Date(tickTime);
							time.textContent = Number.isNaN(date.getTime()) ? '--:--:--.---' :
								date.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
							var price = document.createElement('span');
							price.className = 'tick-tape-price';
							price.textContent = Number(tick.price).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 8 });
							var volume = document.createElement('span');
							volume.textContent = Number(tick.volume || 0).toLocaleString(undefined, { maximumFractionDigits: 8 });
							row.append(time, price, volume);
							tickTapeItems.prepend(row);
							while (tickTapeItems.childElementCount > 80) {
								tickTapeItems.lastElementChild.remove();
							}
							tickTapeStatus.textContent = Number.isFinite(tickTime) && Date.now() - tickTime > 60 * 1000
								? 'STALE DATA'
								: 'LIVE';
						} catch (error) {
							tickTapeStatus.textContent = 'INVALID TICK';
							console.error('Unable to read BTC/USD tick:', error);
						}
					};
					source.onerror = function () {
						if (tickTapeSource === source) { tickTapeStatus.textContent = 'RECONNECTING'; }
					};
				}

				function setTickTapeOpen(open) {
					tickTape.hidden = !open;
					tickTapeToggle.setAttribute('aria-expanded', String(open));
					if (open) {
						startTickTape(activeSymbol);
						return;
					}
					if (tickTapeSource) {
						tickTapeSource.close();
						tickTapeSource = null;
					}
					tickTapeStatus.textContent = 'STOPPED';
				}

				tickTapeToggle.addEventListener('click', function () {
					setTickTapeOpen(tickTape.hidden);
				});
				tickTapeClose.addEventListener('click', function () { setTickTapeOpen(false); });
				watchSearchToggle.addEventListener('click', function () {
					setWatchSearchOpen(watchSearchWrap.hidden);
				});
				document.addEventListener('keydown', function (event) {
					var target = event.target;
					var isTextEntry = target instanceof HTMLElement &&
						(target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
					if ((event.key === '/' && !isTextEntry) ||
						((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k')) {
						event.preventDefault();
						openCommandPalette();
						return;
					}
					if (event.key === 'Escape' && !commandPalette.hidden) {
						closeCommandPalette();
						return;
					}
					if (event.key === 'Escape' && !watchSearchWrap.hidden) { setWatchSearchOpen(false); }
					if (event.key === 'Escape' && !tickTape.hidden) {
						setTickTapeOpen(false);
						tickTapeToggle.focus();
					}
				});

				function restoreMinimizedCharts() {
					var restored = 0;
					visibleChartIndexes.forEach(function (index) {
						var cell = document.getElementById('chart-cell-' + index);
						var button = cell && cell.querySelector('.chart-window-actions .chart-window-button');
						if (cell && button && cell.classList.contains('is-minimized')) {
							restoreChartWindow(index, cell, button);
							restored += 1;
						}
					});
					if (!restored) { document.getElementById('chart-layout-status').textContent = 'NO MINIMIZED CHARTS'; }
				}

				function setWorkspaceTheme(themeId) {
					if (!themePresets.some(function (theme) { return theme.id === themeId; })) { return; }
					document.documentElement.dataset.theme = themeId;
					document.querySelector('meta[name="theme-color"]').content =
						themeId === 'midnight' ? '#080d18' :
						themeId === 'graphite' ? '#101112' :
						themeId === 'forest' ? '#08110e' :
						themeId === 'plum' ? '#110d15' : '#070809';
					try {
						localStorage.setItem('lse-theme', themeId);
					} catch (error) {
						console.error('Unable to save theme preference:', error);
					}
					workspaceCanvases.forEach(function (canvas) {
						var grid = canvasGrid(canvas);
						var calendarWidget = grid.querySelector('.calendar-app-window .tradingview-widget-container');
						if (calendarWidget) { renderEconomicCalendar('dark', calendarWidget); }
					});
				}

				var workspaceCommands = [
					{ command: '/canvas', title: 'New canvas', detail: 'Create and switch to a new workspace canvas', run: addCanvas },
					{ command: '/chart', title: 'New chart', detail: 'Open a chart window', run: addChartWindow },
					{ command: '/charts', title: 'Restore minimized charts', detail: 'Bring minimized charts back to the canvas', run: restoreMinimizedCharts },
					{ command: '/watchlist', title: 'Open watchlist', detail: 'Show the watchlist as a floating window', run: function () { setWatchlistHidden(false, true); } },
					{ command: '/watchlist hide', title: 'Hide watchlist', detail: 'Close the floating watchlist', run: function () { setWatchlistHidden(true, true); } },
					{ command: '/news', title: 'Economic calendar', detail: 'Open the market events calendar', run: openEconomicCalendarWindow },
					{ command: '/calendar', title: 'Economic calendar', detail: 'Open the market events calendar', run: openEconomicCalendarWindow },
				];
				themePresets.forEach(function (theme) {
					workspaceCommands.push({
						command: '/theme ' + theme.id,
						title: theme.title + ' theme',
						detail: theme.detail,
						run: function () { setWorkspaceTheme(theme.id); },
					});
				});

				function renderCommandResults() {
					var query = commandInput.value.trim().toLowerCase();
					commandResults.replaceChildren();
					workspaceCommands.filter(function (item) {
						return !query || item.command.startsWith(query) ||
							item.title.toLowerCase().includes(query.replace(/^\//, ''));
					}).forEach(function (item) {
						var result = document.createElement('button');
						result.type = 'button';
						result.className = 'command-result';
						result.innerHTML = '<kbd></kbd><span><strong></strong><small></small></span><i>↵</i>';
						result.querySelector('kbd').textContent = item.command;
						result.querySelector('strong').textContent = item.title;
						result.querySelector('small').textContent = item.detail;
						result.addEventListener('click', function () { runWorkspaceCommand(item); });
						commandResults.append(result);
					});
				}

				function openCommandPalette() {
					commandPalette.hidden = false;
					commandInput.value = '/';
					renderCommandResults();
					commandInput.focus();
				}

				function closeCommandPalette() {
					commandPalette.hidden = true;
					commandInput.value = '';
				}

				function runWorkspaceCommand(command) {
					closeCommandPalette();
					command.run();
				}
				commandInput.addEventListener('input', renderCommandResults);
				commandInput.addEventListener('keydown', function (event) {
					if (event.key === 'Escape') {
						closeCommandPalette();
					} else if (event.key === 'Enter') {
						event.preventDefault();
						var requestedCommand = commandInput.value.trim().toLowerCase();
						var exactCommand = workspaceCommands.find(function (item) {
							return item.command === requestedCommand;
						});
						var firstResult = commandResults.querySelector('.command-result');
						if (exactCommand) { runWorkspaceCommand(exactCommand); }
						else if (firstResult) { firstResult.click(); }
					} else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
						event.preventDefault();
						var results = Array.from(commandResults.querySelectorAll('.command-result'));
						if (!results.length) { return; }
						var selected = results.indexOf(document.activeElement);
						var increment = event.key === 'ArrowDown' ? 1 : -1;
						results[(selected + increment + results.length) % results.length].focus();
					}
				});
				commandPalette.addEventListener('mousedown', function (event) {
					if (event.target === commandPalette) { closeCommandPalette(); }
				});
				document.getElementById('command-palette-toggle').addEventListener('click', openCommandPalette);
				document.getElementById('watchlist-close').addEventListener('click', function () {
					setWatchlistHidden(true, true);
				});

				function searchSymbols(query) {
					if (!query) {
						searchResults.replaceChildren();
						return;
					}
					fetch(datafeedUrl + '/search?query=' + encodeURIComponent(query))
						.then(function (response) { return response.json(); })
						.then(function (results) {
							searchResults.replaceChildren();
							results.slice(0, 8).forEach(function (result) {
								var option = document.createElement('button');
								option.type = 'button';
								option.className = 'search-result';
								option.innerHTML = '<strong></strong><span></span>';
								option.querySelector('strong').textContent = displaySymbol(result.symbol);
								option.querySelector('span').textContent = result.description;
								option.addEventListener('click', function () {
									addToWatchlist({ symbol: result.symbol, name: result.description });
								});
								searchResults.append(option);
							});
						});
				}

				searchInput.addEventListener('input', function () {
					window.clearTimeout(searchTimer);
					searchTimer = window.setTimeout(function () { searchSymbols(searchInput.value.trim()); }, 220);
				});
				document.addEventListener('click', function (event) {
					if (!event.target.closest('.watch-search-wrap') && !event.target.closest('#watch-search-toggle')) {
						searchResults.replaceChildren();
						if (!watchSearchWrap.hidden) { setWatchSearchOpen(false); }
					}
				});

				function renderEconomicCalendar(theme, container) {
					container.replaceChildren();
					var widgetRoot = document.createElement('div');
					widgetRoot.className = 'tradingview-widget-container__widget';
					var script = document.createElement('script');
					script.type = 'text/javascript';
					script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-events.js';
					script.async = true;
					script.textContent = JSON.stringify({
						colorTheme: theme,
						isTransparent: true,
						width: '100%',
						height: '320',
						locale: 'en',
						importanceFilter: '-1,0,1',
						countryFilter: 'us',
					});
					container.append(widgetRoot, script);
				}

				function openEconomicCalendarWindow() {
					if (calendarAppWindow) {
						calendarAppWindow.classList.remove('is-minimized');
						calendarAppWindow.hidden = false;
						calendarAppWindow.style.zIndex = String(nextCanvasZIndex());
						saveChartDesktop();
						return;
					}
					var bounds = chartGrid.getBoundingClientRect();
					var appWindow = document.createElement('section');
					appWindow.className = 'canvas-app-window calendar-app-window';
					appWindow.setAttribute('aria-label', 'Economic calendar');
					appWindow.style.left = Math.max(12, (bounds.width - 560) / 2) + 'px';
					appWindow.style.top = Math.max(12, (bounds.height - 500) / 2) + 'px';
					appWindow.style.width = Math.min(560, Math.max(320, bounds.width - 24)) + 'px';
					appWindow.style.height = Math.min(500, Math.max(260, bounds.height - 24)) + 'px';
					appWindow.style.zIndex = String(nextCanvasZIndex());
					var titlebar = document.createElement('div');
					titlebar.className = 'chart-window-titlebar calendar-window-titlebar';
					titlebar.innerHTML = '<strong>ECONOMIC CALENDAR</strong><div class="chart-window-actions"></div>';
					var closeButton = document.createElement('button');
					closeButton.type = 'button';
					closeButton.className = 'chart-window-button chart-window-close';
					closeButton.setAttribute('aria-label', 'Close economic calendar');
					closeButton.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg>';
					closeButton.addEventListener('click', function () {
						appWindow.remove();
						calendarAppWindow = null;
						saveChartDesktop();
					});
					titlebar.querySelector('.chart-window-actions').append(closeButton);
					var content = document.createElement('div');
					content.className = 'calendar-window-content';
					var widget = document.createElement('div');
					widget.className = 'tradingview-widget-container';
					content.append(widget);
					appWindow.append(titlebar, content);
					appWindow.addEventListener('pointerdown', function () {
						appWindow.style.zIndex = String(nextCanvasZIndex());
					});
					titlebar.addEventListener('pointerdown', function (event) {
						if (event.button !== 0 || event.target.closest('button')) { return; }
						event.preventDefault();
						appWindow.style.zIndex = String(nextCanvasZIndex());
						titlebar.setPointerCapture(event.pointerId);
						var startX = event.clientX;
						var startY = event.clientY;
						var startLeft = appWindow.offsetLeft;
						var startTop = appWindow.offsetTop;
						var dragFinished = false;
						function moveAppWindow(moveEvent) {
							if (moveEvent.pointerId !== event.pointerId) { return; }
							if ((moveEvent.buttons & 1) === 0) {
								finishMove();
								return;
							}
							appWindow.style.left = Math.max(0, startLeft + moveEvent.clientX - startX) + 'px';
							appWindow.style.top = Math.max(0, startTop + moveEvent.clientY - startY) + 'px';
						}
						function finishMove() {
							if (dragFinished) { return; }
							dragFinished = true;
							window.removeEventListener('pointermove', moveAppWindow);
							window.removeEventListener('pointerup', finishMove);
							window.removeEventListener('pointercancel', finishMove);
							if (titlebar.hasPointerCapture(event.pointerId)) {
								titlebar.releasePointerCapture(event.pointerId);
							}
						}
						window.addEventListener('pointermove', moveAppWindow);
						window.addEventListener('pointerup', finishMove);
						window.addEventListener('pointercancel', finishMove);
					});
					chartGrid.append(appWindow);
					calendarAppWindow = appWindow;
					renderEconomicCalendar(initialTheme, widget);
					saveChartDesktop();
				}

				addCanvasButton.addEventListener('click', addCanvas);
				renderCanvasTabs();
				workspaceCanvases.forEach(function (canvas) { canvasGrid(canvas); });
				chartGrid.hidden = false;
				addChartButton.addEventListener('click', addChartWindow);
				activeChartSelect.addEventListener('change', function () {
					setActiveChartWidget(Number(activeChartSelect.value));
				});
				var drawingSyncToggle = document.getElementById('drawing-sync-toggle');
				drawingSyncToggle.checked = drawingSyncEnabled;
				drawingSyncToggle.addEventListener('change', function () {
					drawingSyncEnabled = drawingSyncToggle.checked;
					try {
						localStorage.setItem(drawingSyncStorageKey, String(drawingSyncEnabled));
					} catch (error) {
						console.error('Unable to save drawing sync preference:', error);
					}
					if (drawingSyncEnabled) {
						synchronizeAllDrawings();
					} else {
						clearDrawingMirrors();
					}
				});
				function setWatchlistHidden(hidden, persist) {
					var terminalGrid = document.querySelector('.terminal-grid');
					terminalGrid.classList.add('is-watchlist-hidden');
					watchlistPanel.classList.toggle('is-floating', !hidden);
					watchlistPanel.hidden = hidden;
					if (!hidden) {
						try {
							var savedPosition = JSON.parse(localStorage.getItem(watchlistPositionStorageKey) || 'null');
							if (savedPosition && Number.isFinite(savedPosition.left) && Number.isFinite(savedPosition.top)) {
								watchlistPanel.style.left = Math.max(0, Math.min(
									window.innerWidth - watchlistPanel.offsetWidth, savedPosition.left
								)) + 'px';
								watchlistPanel.style.top = Math.max(0, Math.min(
									window.innerHeight - 48, savedPosition.top
								)) + 'px';
								watchlistPanel.style.right = 'auto';
							}
						} catch (error) {
							console.error('Unable to restore watchlist position:', error);
						}
					}
					watchlistPanel.setAttribute('aria-hidden', String(hidden));
					watchlistPanel.inert = hidden;
					if (persist) {
						try {
							localStorage.setItem(watchlistToggleStorageKey, String(hidden));
						} catch (error) {
							console.error('Unable to save watchlist visibility:', error);
						}
					}
				}
				var watchlistTitlebar = watchlistPanel.querySelector('.watchlist-tools');
				watchlistTitlebar.addEventListener('pointerdown', function (event) {
					if (!watchlistPanel.classList.contains('is-floating') || event.button !== 0 ||
						event.target.closest('button')) { return; }
					event.preventDefault();
					watchlistTitlebar.setPointerCapture(event.pointerId);
					var startX = event.clientX;
					var startY = event.clientY;
					var startLeft = watchlistPanel.getBoundingClientRect().left;
					var startTop = watchlistPanel.getBoundingClientRect().top;
					function moveWatchlist(moveEvent) {
						if (moveEvent.pointerId !== event.pointerId) { return; }
						watchlistPanel.style.left = Math.max(0, Math.min(
							window.innerWidth - watchlistPanel.offsetWidth,
							startLeft + moveEvent.clientX - startX
						)) + 'px';
						watchlistPanel.style.top = Math.max(0, Math.min(
							window.innerHeight - 48,
							startTop + moveEvent.clientY - startY
						)) + 'px';
					}
					function finishWatchlistMove() {
						window.removeEventListener('pointermove', moveWatchlist);
						window.removeEventListener('pointerup', finishWatchlistMove);
						window.removeEventListener('pointercancel', finishWatchlistMove);
						if (watchlistTitlebar.hasPointerCapture(event.pointerId)) {
							watchlistTitlebar.releasePointerCapture(event.pointerId);
						}
						try {
							localStorage.setItem(watchlistPositionStorageKey, JSON.stringify({
								left: watchlistPanel.offsetLeft,
								top: watchlistPanel.offsetTop,
							}));
						} catch (error) {
							console.error('Unable to save watchlist position:', error);
						}
					}
					window.addEventListener('pointermove', moveWatchlist);
					window.addEventListener('pointerup', finishWatchlistMove);
					window.addEventListener('pointercancel', finishWatchlistMove);
				});
				setWatchlistHidden(true, false);

				renderWatchlist();
				visibleChartIndexes.forEach(function (index) {
					ensureChartWidget(index);
				});
				if (initialCanvas.calendarOpen) { openEconomicCalendarWindow(); }
				if (visibleChartIndexes.length) { setChartWindowActive(visibleChartIndexes[0]); }
				updateChartSelectors();
				saveChartDesktop();
			};

			window.addEventListener('DOMContentLoaded', initOnReady, false);
		</script>

	</head>

	<body>
		<div class="desk-shell">
			<div class="terminal-grid">
				<main class="chart-workspace">
					<div class="chart-layout-bar" aria-label="Chart layout controls">
						<button id="add-chart-window" class="workspace-action-button" type="button" aria-label="Add chart" title="Add chart"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg><span>CHART</span></button>
						<button id="command-palette-toggle" class="workspace-action-button command-open-button" type="button" aria-label="Open command palette" title="Command palette (/)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4-3 4 3 4m4-8 3 4-3 4"/></svg><span>COMMAND</span><kbd>/</kbd></button>
						<div id="canvas-tabs" class="canvas-tabs" aria-label="Workspace canvases">
							<button id="add-canvas" class="workspace-action-button add-canvas-button" type="button" title="Add canvas" aria-label="Add canvas"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
						</div>
						<label for="active-chart-select">ACTIVE CHART
							<select id="active-chart-select" aria-label="Active chart"></select>
						</label>
						<label class="drawing-sync-control" for="drawing-sync-toggle" title="Synchronize drawings across matching charts">
							<input id="drawing-sync-toggle" type="checkbox">
							<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 5.3 3.8 6.7a2.1 2.1 0 0 0 3 3l1.1-1.1m.9-1.9 1.4-1.4a2.1 2.1 0 0 0-3-3L6.1 3.4m-2.7 8.8 9.2-9.2"/></svg><span>SYNC</span>
						</label>
						<span id="chart-layout-status" role="status" aria-live="polite"></span>
					</div>
					<div class="chart-frame"><div id="chart-grid"></div></div>
				</main>
				<aside id="watchlist-panel" class="watchlist-panel" aria-label="Watchlist">
					<div class="watchlist-tools">
						<strong class="watchlist-window-label">WATCHLIST</strong>
						<span class="watchlist-live-label"><i></i> LIVE</span>
					</div>
					<div class="panel-heading">
						<div><span class="section-index">01</span><h2>Watchlist</h2></div>
						<div class="panel-heading-actions">
							<span id="watch-count" class="watch-count">03</span>
							<button id="tick-tape-toggle" class="tick-tape-toggle" type="button" title="Open live tick tape for current chart symbol" aria-label="Open live tick tape for current chart symbol" aria-expanded="false" aria-controls="tick-tape"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 11.5h2l2-7 3 9 2-5h2"/></svg></button>
							<button id="watch-search-toggle" class="watch-add-toggle" type="button" title="Add symbol" aria-label="Add symbol" aria-expanded="false" aria-controls="watch-search-wrap"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
							<button id="watchlist-close" class="watch-add-toggle" type="button" title="Hide watchlist" aria-label="Hide watchlist"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
						</div>
					</div>
					<section id="tick-tape" class="tick-tape" aria-label="Live tick tape" hidden>
						<div class="tick-tape-heading">
							<div><span class="feed-mark"></span><strong class="tick-tape-symbol"></strong><span id="tick-tape-status">STOPPED</span></div>
							<button id="tick-tape-close" type="button" aria-label="Close live tick tape">×</button>
						</div>
						<div class="tick-tape-columns" aria-hidden="true"><span>TIME</span><span>PRICE</span><span>SIZE</span></div>
						<div id="tick-tape-items" class="tick-tape-items" aria-live="polite"></div>
					</section>
					<div id="watch-search-wrap" class="watch-search-wrap" hidden>
						<label class="field-label" for="watch-search">ADD SYMBOL</label>
						<input id="watch-search" type="search" autocomplete="off" placeholder="Search markets" aria-label="Search symbols to add">
						<div id="search-results" class="search-results" role="listbox" aria-label="Symbol search results"></div>
					</div>
					<div id="watch-items" class="watch-items"></div>
					<div class="watchlist-foot"><span class="feed-mark"></span><span id="ui-status">HISTORY + LIVE TICKS</span></div>
				</aside>
			</div>
		</div>
		<div id="command-palette" class="command-palette-overlay" hidden>
			<section class="command-palette" role="dialog" aria-modal="true" aria-labelledby="command-palette-title">
				<label id="command-palette-title" class="command-palette-label" for="command-palette-input">COMMAND</label>
				<div class="command-palette-entry"><span>›</span><input id="command-palette-input" type="text" autocomplete="off" spellcheck="false" placeholder="Type a command, e.g. /chart"></div>
				<div id="command-palette-results" class="command-palette-results" role="list"></div>
				<footer><span>↑ ↓ SELECT</span><span>ENTER RUN</span><span>ESC CLOSE</span></footer>
			</section>
		</div>
	</body>

</html>
