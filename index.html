<!DOCTYPE HTML>
<html>
	<head>

		<title>LSE Futures Desk</title>

		<!-- Fix for iOS Safari zooming bug -->
		<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0">
		<meta name="theme-color" content="#12191b">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="dashboard.css?v=20261025-2">

		<script type="text/javascript" src="charting_library/charting_library.standalone.js"></script>
		<script type="text/javascript" src="datafeeds/lse-live-datafeed.js?v=20261025-3"></script>
		<script type="text/javascript" src="datafeeds/hourly-range-bands.js?v=20261024-4"></script>

		<script type="text/javascript">

			function getParameterByName(name) {
				name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
				var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
					results = regex.exec(location.search);
				return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
			}

			function initOnReady() {
				var datafeedUrl = window.location.origin;
				var themeSelect = document.getElementById('theme-select');
				var initialTheme = localStorage.getItem('lse-theme') || getParameterByName('theme') || 'dark';
				var widgetReady = false;
				var chartLayoutReady = false;
				var chartLayoutStorageKey = 'lse-chart-layout-v1';
				document.documentElement.dataset.theme = initialTheme;
				themeSelect.value = initialTheme;

				var widget = window.tvWidget = new TradingView.widget({
					fullscreen: false,
					autosize: true,
					symbol: 'NQ.F',
					interval: '1',
					timezone: 'America/New_York',
					container: "tv_chart_container",
					datafeed: new LSELiveDatafeed(datafeedUrl),
					library_path: "charting_library/",
					locale: getParameterByName('lang') || "en",
					disabled_features: ["use_localstorage_for_settings"],
					enabled_features: ["study_templates", "seconds_resolution", "custom_resolutions"],
					auto_save_delay: 1,
					custom_indicators_getter: function (PineJS) {
						return Promise.resolve([window.AverageHourlyRangeBands(PineJS)]);
					},
					theme: initialTheme,
					overrides: {
						"paneProperties.backgroundType": "solid",
						"paneProperties.background": initialTheme === 'dark' ? 'rgba(11, 16, 18, 0)' : 'rgba(250, 251, 247, 0)',
						"paneProperties.vertGridProperties.color": initialTheme === 'dark' ? 'rgba(178, 194, 186, 0.10)' : 'rgba(65, 82, 70, 0.10)',
						"paneProperties.horzGridProperties.color": initialTheme === 'dark' ? 'rgba(178, 194, 186, 0.10)' : 'rgba(65, 82, 70, 0.10)',
					},
					charts_storage_url: 'https://saveload.tradingview.com',
					charts_storage_api_version: "1.1",
					client_id: 'tradingview.com',
					user_id: 'public_user_id',
				});

				function saveChartLayout() {
					if (!chartLayoutReady) { return; }
					try {
						widget.save(function (state) {
							try {
								localStorage.setItem(chartLayoutStorageKey, JSON.stringify(state));
							} catch (error) {
								console.error('Unable to save chart layout:', error);
							}
						}, { includeDrawings: true });
					} catch (error) {
						console.error('Unable to save chart layout:', error);
					}
				}

				window.addEventListener('pagehide', saveChartLayout);

				var activeSymbol = 'NQ.F';
				var watchItems = document.getElementById('watch-items');
				var searchInput = document.getElementById('watch-search');
				var searchResults = document.getElementById('search-results');
				var watchSearchWrap = document.getElementById('watch-search-wrap');
				var watchSearchToggle = document.getElementById('watch-search-toggle');
				var tickTapeToggle = document.getElementById('tick-tape-toggle');
				var tickTape = document.getElementById('tick-tape');
				var tickTapeClose = document.getElementById('tick-tape-close');
				var tickTapeStatus = document.getElementById('tick-tape-status');
				var tickTapeItems = document.getElementById('tick-tape-items');
				var tickTapeSource = null;
				var searchTimer;
				var quoteStreams = new Map();
				var quoteData = new Map();
				var quoteHistoryRequests = new Set();
				var watchlistStorageKey = 'lse-watchlist';
				var futuresWatchlistMigrationKey = 'lse-watchlist-futures-added-v1';
				var additionalFutures = [
					{ symbol: 'FDAX.F', name: 'DAX Futures' },
					{ symbol: 'FESX.F', name: 'EURO STOXX 50' },
					{ symbol: 'FGBL.F', name: 'Euro-Bund Futures' },
					{ symbol: 'SI.F', name: 'Silver Futures' },
				];
				var defaultWatchlist = [
					{ symbol: 'NQ.F', name: 'NASDAQ 100' },
					{ symbol: 'ES.F', name: 'S&P 500' },
					{ symbol: 'GC.F', name: 'GOLD' },
					{ symbol: 'FDAX.F', name: 'DAX Futures' },
					{ symbol: 'FESX.F', name: 'EURO STOXX 50' },
					{ symbol: 'FGBL.F', name: 'Euro-Bund Futures' },
					{ symbol: 'SI.F', name: 'Silver Futures' },
				];
				var watchlist;
				try {
					watchlist = JSON.parse(localStorage.getItem(watchlistStorageKey) || 'null') || defaultWatchlist;
				} catch (error) {
					watchlist = defaultWatchlist;
				}
				if (localStorage.getItem(futuresWatchlistMigrationKey) !== 'true') {
					additionalFutures.forEach(function (item) {
						if (!watchlist.some(function (entry) { return entry.symbol === item.symbol; })) {
							watchlist.push(item);
						}
					});
					localStorage.setItem(watchlistStorageKey, JSON.stringify(watchlist));
					localStorage.setItem(futuresWatchlistMigrationKey, 'true');
				}

				function displaySymbol(symbol) {
					return symbol.replace(/\.F$/i, '');
				}

				function updateSymbol(symbol) {
					activeSymbol = symbol;
					watchItems.querySelectorAll('[data-symbol]').forEach(function (button) {
						var active = button.dataset.symbol === symbol;
						button.classList.toggle('is-active', active);
						button.setAttribute('aria-pressed', String(active));
					});
				}

				function selectSymbol(symbol) {
					widget.activeChart().setSymbol(symbol);
				}

				function saveWatchlist() {
					localStorage.setItem(watchlistStorageKey, JSON.stringify(watchlist));
				}

				function formatQuotePrice(value) {
					return new Intl.NumberFormat('en-US', {
						maximumFractionDigits: value >= 1000 ? 2 : 4,
					}).format(value);
				}

				function renderQuote(symbol) {
					var quote = quoteData.get(symbol);
					var select = Array.from(watchItems.querySelectorAll('[data-symbol]')).find(function (item) {
						return item.dataset.symbol === symbol;
					});
					if (!select || !quote) { return; }
					var price = select.querySelector('.watch-quote-price');
					var change = select.querySelector('.watch-quote-change');
					price.textContent = quote.last === null ? '—' : formatQuotePrice(quote.last);
					price.title = quote.last === null ? 'Waiting for a live trade' : formatQuotePrice(quote.last);
					if (quote.last === null || quote.previousClose === null || quote.previousClose === 0) {
						change.textContent = '—';
						change.classList.remove('is-positive', 'is-negative');
						return;
					}
					var percentage = (quote.last - quote.previousClose) / quote.previousClose * 100;
					change.textContent = (percentage > 0 ? '+' : '') + percentage.toFixed(2) + '%';
					change.classList.toggle('is-positive', percentage >= 0);
					change.classList.toggle('is-negative', percentage < 0);
				}

				function loadPreviousClose(symbol) {
					if (quoteData.has(symbol) || quoteHistoryRequests.has(symbol)) { return; }
					quoteHistoryRequests.add(symbol);
					var now = Math.floor(Date.now() / 1000);
					var url = new URL(datafeedUrl + '/history');
					url.searchParams.set('symbol', symbol);
					url.searchParams.set('resolution', '1D');
					url.searchParams.set('from', String(now - 14 * 86400));
					url.searchParams.set('to', String(now));
					url.searchParams.set('countback', '3');
					fetch(url.toString())
						.then(function (response) {
							if (!response.ok) { throw new Error('Quote history request failed for ' + symbol); }
							return response.json();
						})
						.then(function (history) {
							if (history.s === 'error') { throw new Error(history.errmsg); }
							if (history.s !== 'ok' || !history.c.length) { return; }
							var lastIndex = history.c.length - 1;
							var latestDate = new Date(history.t[lastIndex] * 1000);
							var today = new Date();
							var isCurrentDayBar = latestDate.getUTCFullYear() === today.getUTCFullYear() &&
								latestDate.getUTCMonth() === today.getUTCMonth() &&
								latestDate.getUTCDate() === today.getUTCDate();
							var previousIndex = isCurrentDayBar ? lastIndex - 1 : lastIndex;
							if (previousIndex < 0) { return; }
							var quote = quoteData.get(symbol) || {
								last: Number(history.c[lastIndex]),
								previousClose: null,
							};
							quote.previousClose = Number(history.c[previousIndex]);
							quoteData.set(symbol, quote);
							renderQuote(symbol);
						})
						.catch(function (error) { console.error('Watchlist quote:', error); })
						.finally(function () { quoteHistoryRequests.delete(symbol); });
				}

				function syncQuoteStreams() {
					var symbols = new Set(watchlist.map(function (item) { return item.symbol; }));
					quoteStreams.forEach(function (source, symbol) {
						if (!symbols.has(symbol)) {
							source.close();
							quoteStreams.delete(symbol);
							quoteData.delete(symbol);
						}
					});
					symbols.forEach(function (symbol) {
						loadPreviousClose(symbol);
						renderQuote(symbol);
						if (quoteStreams.has(symbol)) { return; }
						var streamUrl = new URL(datafeedUrl + '/stream');
						streamUrl.searchParams.set('symbol', symbol);
						streamUrl.searchParams.set('start', new Date().toISOString());
						var source = new EventSource(streamUrl.toString());
						source.onmessage = function (event) {
							var tick = JSON.parse(event.data);
							if (tick.error) {
								console.error('Watchlist live quote for ' + symbol + ':', tick.error);
								return;
							}
							var quote = quoteData.get(symbol) || { last: null, previousClose: null };
							quote.last = Number(tick.price);
							quoteData.set(symbol, quote);
							renderQuote(symbol);
						};
						source.onerror = function () {
							console.warn('Watchlist quote stream reconnecting for', symbol);
						};
						quoteStreams.set(symbol, source);
					});
				}

				function renderWatchlist() {
					watchItems.replaceChildren();
					document.getElementById('watch-count').textContent = String(watchlist.length).padStart(2, '0');
					watchlist.forEach(function (item) {
						var row = document.createElement('div');
						row.className = 'watch-row';
						var select = document.createElement('button');
						select.type = 'button';
						select.className = 'watch-select';
						select.dataset.symbol = item.symbol;
						select.setAttribute('aria-pressed', 'false');
						select.innerHTML = '<span class="watch-symbol"></span><span class="watch-description"></span><span class="watch-quote-price">—</span><span class="watch-quote-change">—</span>';
						select.querySelector('.watch-symbol').textContent = displaySymbol(item.symbol);
						select.querySelector('.watch-description').textContent = item.name;
						select.title = item.symbol + ' · ' + item.name;
						select.addEventListener('click', function () { selectSymbol(item.symbol); });
						var remove = document.createElement('button');
						remove.type = 'button';
						remove.className = 'watch-remove';
						remove.setAttribute('aria-label', 'Remove ' + item.symbol + ' from watchlist');
						remove.textContent = '−';
						remove.addEventListener('click', function () {
							watchlist = watchlist.filter(function (entry) { return entry.symbol !== item.symbol; });
						saveWatchlist();
						renderWatchlist();
						});
						row.append(select, remove);
						watchItems.append(row);
					});
					updateSymbol(activeSymbol);
					syncQuoteStreams();
				}

				function addToWatchlist(item) {
					if (!watchlist.some(function (entry) { return entry.symbol === item.symbol; })) {
						watchlist.push({ symbol: item.symbol, name: item.name || item.description || item.symbol });
						saveWatchlist();
						renderWatchlist();
					}
					setWatchSearchOpen(false);
					selectSymbol(item.symbol);
				}

				function setWatchSearchOpen(open) {
					watchSearchWrap.hidden = !open;
					watchSearchToggle.setAttribute('aria-expanded', String(open));
					if (open) {
						searchInput.focus();
					} else {
						searchInput.value = '';
						searchResults.replaceChildren();
					}
				}

				function startTickTape(symbol) {
					if (tickTapeSource) {
						tickTapeSource.close();
						tickTapeSource = null;
					}
					tickTapeItems.replaceChildren();
					tickTapeStatus.textContent = 'CONNECTING';
					var streamUrl = new URL(datafeedUrl + '/stream');
					streamUrl.searchParams.set('symbol', symbol);
					streamUrl.searchParams.set('start', new Date().toISOString());
					var source = new EventSource(streamUrl.toString());
					tickTapeSource = source;
					var symbolLabel = tickTape.querySelector('.tick-tape-symbol');
					symbolLabel.textContent = symbol;
					tickTape.setAttribute('aria-label', symbol + ' live tick tape');
					tickTapeToggle.title = 'Open live tick tape for ' + symbol;
					tickTapeToggle.setAttribute('aria-label', 'Open live tick tape for ' + symbol);
					source.onopen = function () {
						if (tickTapeSource === source) { tickTapeStatus.textContent = 'LIVE'; }
					};
					source.onmessage = function (event) {
						if (tickTapeSource !== source) { return; }
						try {
							var tick = JSON.parse(event.data);
							if (tick.error) {
								tickTapeStatus.textContent = 'FEED ERROR';
								console.error(symbol + ' tape:', tick.error);
								return;
							}
							var row = document.createElement('div');
							row.className = 'tick-tape-row';
							var time = document.createElement('time');
							var date = new Date(Number(tick.timestamp_ms || Number(tick.time) * 1000));
							time.textContent = Number.isNaN(date.getTime()) ? '--:--:--.---' :
								date.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
							var price = document.createElement('span');
							price.className = 'tick-tape-price';
							price.textContent = Number(tick.price).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 8 });
							var volume = document.createElement('span');
							volume.textContent = Number(tick.volume || 0).toLocaleString(undefined, { maximumFractionDigits: 8 });
							row.append(time, price, volume);
							tickTapeItems.prepend(row);
							while (tickTapeItems.childElementCount > 80) {
								tickTapeItems.lastElementChild.remove();
							}
							tickTapeStatus.textContent = 'LIVE';
						} catch (error) {
							tickTapeStatus.textContent = 'INVALID TICK';
							console.error('Unable to read BTC/USD tick:', error);
						}
					};
					source.onerror = function () {
						if (tickTapeSource === source) { tickTapeStatus.textContent = 'RECONNECTING'; }
					};
				}

				function setTickTapeOpen(open) {
					tickTape.hidden = !open;
					tickTapeToggle.setAttribute('aria-expanded', String(open));
					if (open) {
						startTickTape(activeSymbol);
						return;
					}
					if (tickTapeSource) {
						tickTapeSource.close();
						tickTapeSource = null;
					}
					tickTapeStatus.textContent = 'STOPPED';
				}

				tickTapeToggle.addEventListener('click', function () {
					setTickTapeOpen(tickTape.hidden);
				});
				tickTapeClose.addEventListener('click', function () { setTickTapeOpen(false); });
				watchSearchToggle.addEventListener('click', function () {
					setWatchSearchOpen(watchSearchWrap.hidden);
				});
				document.addEventListener('keydown', function (event) {
					if (event.key === 'Escape' && !watchSearchWrap.hidden) { setWatchSearchOpen(false); }
					if (event.key === 'Escape' && !tickTape.hidden) {
						setTickTapeOpen(false);
						tickTapeToggle.focus();
					}
				});

				function searchSymbols(query) {
					if (!query) {
						searchResults.replaceChildren();
						return;
					}
					fetch(datafeedUrl + '/search?query=' + encodeURIComponent(query))
						.then(function (response) { return response.json(); })
						.then(function (results) {
							searchResults.replaceChildren();
							results.slice(0, 8).forEach(function (result) {
								var option = document.createElement('button');
								option.type = 'button';
								option.className = 'search-result';
								option.innerHTML = '<strong></strong><span></span>';
								option.querySelector('strong').textContent = displaySymbol(result.symbol);
								option.querySelector('span').textContent = result.description;
								option.addEventListener('click', function () {
									addToWatchlist({ symbol: result.symbol, name: result.description });
								});
								searchResults.append(option);
							});
						});
				}

				searchInput.addEventListener('input', function () {
					window.clearTimeout(searchTimer);
					searchTimer = window.setTimeout(function () { searchSymbols(searchInput.value.trim()); }, 220);
				});
				document.addEventListener('click', function (event) {
					if (!event.target.closest('.watch-search-wrap') && !event.target.closest('#watch-search-toggle')) {
						searchResults.replaceChildren();
						if (!watchSearchWrap.hidden) { setWatchSearchOpen(false); }
					}
				});

				function applyTheme(theme, persist) {
					document.documentElement.dataset.theme = theme;
					document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#12191b' : '#edf1e9';
					if (persist) { localStorage.setItem('lse-theme', theme); }
					if (widgetReady) { widget.changeTheme(theme); }
				}

				themeSelect.addEventListener('change', function () { applyTheme(themeSelect.value, true); });

				var wallpaperOpacityControl = document.getElementById('wallpaper-opacity-control');
				var wallpaperOpacityInput = document.getElementById('wallpaper-opacity');
				var wallpaperOpacityOutput = document.getElementById('wallpaper-opacity-value');
				var clearWallpaperButton = document.getElementById('clear-wallpaper');

				function applyWallpaperOpacity(value, persist) {
					var opacity = Number(value);
					if (!Number.isFinite(opacity)) { opacity = 18; }
					opacity = Math.round(Math.max(0, Math.min(100, opacity)));
					document.documentElement.style.setProperty('--wallpaper-overlay-opacity', (100 - opacity) + '%');
					wallpaperOpacityInput.value = String(opacity);
					wallpaperOpacityOutput.textContent = opacity + '%';
					if (persist) {
						try { localStorage.setItem('lse-wallpaper-opacity', String(opacity)); }
						catch (error) { document.getElementById('ui-status').textContent = 'Opacity applied for this session'; }
					}
				}

				wallpaperOpacityInput.addEventListener('input', function () {
					applyWallpaperOpacity(wallpaperOpacityInput.value, true);
				});

				function applyWallpaper(image, persist) {
					document.documentElement.style.setProperty('--wallpaper-image', image ? 'url("' + image + '")' : 'none');
					document.documentElement.classList.toggle('has-wallpaper', Boolean(image));
					wallpaperOpacityControl.hidden = !image;
					clearWallpaperButton.hidden = !image;
					document.getElementById('ui-status').textContent = image ? 'CUSTOM BACKGROUND' : 'HISTORY + LIVE TICKS';
					if (persist) {
						try { localStorage.setItem('lse-wallpaper', image || ''); }
						catch (error) { document.getElementById('ui-status').textContent = 'Image applied for this session'; }
					}
				}

				var savedWallpaperOpacity = localStorage.getItem('lse-wallpaper-opacity');
				applyWallpaperOpacity(savedWallpaperOpacity === null ? 18 : savedWallpaperOpacity, false);
				var savedWallpaper = localStorage.getItem('lse-wallpaper');
				if (savedWallpaper) { applyWallpaper(savedWallpaper, false); }
				document.getElementById('wallpaper-input').addEventListener('change', function (event) {
					var file = event.target.files && event.target.files[0];
					if (!file || !file.type.startsWith('image/')) { return; }
					var reader = new FileReader();
					reader.onload = function () { applyWallpaper(reader.result, true); };
					reader.readAsDataURL(file);
				});
				document.getElementById('clear-wallpaper').addEventListener('click', function () { applyWallpaper('', true); });

				widget.onChartReady(async function () {
					widgetReady = true;
					var chart = widget.activeChart();
					widget.subscribe('onAutoSaveNeeded', saveChartLayout);
					chart.onSymbolChanged().subscribe(null, function (info) {
						var symbol = info.ticker || info.name;
						updateSymbol(symbol);
						if (!tickTape.hidden) { startTickTape(symbol); }
					});
					chart.onDataLoaded().subscribe(null, function () {
						var previousNames = [
							"Average Hourly & 4-Hour Range Bands",
							"Average Hourly Range Bands",
							"IV WALLS[D + W + H + 4H]",
						];
						var studies = chart.getAllStudies();
						studies.forEach(function (study) {
							if (previousNames.indexOf(study.name) !== -1) {
								chart.removeEntity(study.id);
							}
						});
						if (!studies.some(function (study) { return study.name === "NY 18:00 Hourly & 4-Hour Range Bands"; })) {
							chart.createStudy("NY 18:00 Hourly & 4-Hour Range Bands", false, false)
								.catch(function (error) { console.error('Unable to add hourly range bands:', error); });
						}
					}, true);
					try {
						var savedLayout = localStorage.getItem(chartLayoutStorageKey);
						if (savedLayout) {
							await widget.load(JSON.parse(savedLayout));
						}
					} catch (error) {
						console.error('Unable to restore saved chart layout:', error);
					}
					chartLayoutReady = true;
					renderWatchlist();
				});

			};

			window.addEventListener('DOMContentLoaded', initOnReady, false);
		</script>

	</head>

	<body>
		<div class="desk-shell">
			<div class="terminal-grid">
				<main class="chart-workspace">
					<div class="chart-frame"><div id="tv_chart_container"></div></div>
				</main>
				<aside class="watchlist-panel" aria-label="Watchlist">
					<div class="watchlist-tools">
						<label class="theme-control" for="theme-select"><span>THEME</span><select id="theme-select" aria-label="Chart theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
						<details class="wallpaper-menu">
							<summary class="tool-button">Wallpaper</summary>
							<div class="wallpaper-menu-panel">
								<label class="wallpaper-file-button" for="wallpaper-input">Choose image</label>
								<input id="wallpaper-input" type="file" accept="image/*" hidden>
								<div id="wallpaper-opacity-control" class="wallpaper-opacity-control" hidden>
									<label for="wallpaper-opacity">IMAGE OPACITY</label>
									<output id="wallpaper-opacity-value" for="wallpaper-opacity">18%</output>
									<input id="wallpaper-opacity" type="range" min="0" max="100" step="1" value="18" aria-label="Wallpaper image opacity">
								</div>
								<button id="clear-wallpaper" class="wallpaper-reset" type="button" hidden>Remove image</button>
							</div>
						</details>
					</div>
					<div class="panel-heading">
						<div><span class="section-index">01</span><h2>Watchlist</h2></div>
						<div class="panel-heading-actions">
							<span id="watch-count" class="watch-count">03</span>
							<button id="tick-tape-toggle" class="tick-tape-toggle" type="button" title="Open live tick tape for current chart symbol" aria-label="Open live tick tape for current chart symbol" aria-expanded="false" aria-controls="tick-tape">TAPE</button>
							<button id="watch-search-toggle" class="watch-add-toggle" type="button" title="Add symbol" aria-label="Add symbol" aria-expanded="false" aria-controls="watch-search-wrap">+</button>
						</div>
					</div>
					<section id="tick-tape" class="tick-tape" aria-label="Live tick tape" hidden>
						<div class="tick-tape-heading">
							<div><span class="feed-mark"></span><strong class="tick-tape-symbol"></strong><span id="tick-tape-status">STOPPED</span></div>
							<button id="tick-tape-close" type="button" aria-label="Close live tick tape">×</button>
						</div>
						<div class="tick-tape-columns" aria-hidden="true"><span>TIME</span><span>PRICE</span><span>SIZE</span></div>
						<div id="tick-tape-items" class="tick-tape-items" aria-live="polite"></div>
					</section>
					<div id="watch-search-wrap" class="watch-search-wrap" hidden>
						<label class="field-label" for="watch-search">ADD SYMBOL</label>
						<input id="watch-search" type="search" autocomplete="off" placeholder="Search markets" aria-label="Search symbols to add">
						<div id="search-results" class="search-results" role="listbox" aria-label="Symbol search results"></div>
					</div>
					<div id="watch-items" class="watch-items"></div>
					<div class="watchlist-foot"><span class="feed-mark"></span><span id="ui-status">HISTORY + LIVE TICKS</span></div>
				</aside>
			</div>
		</div>
	</body>

</html>
